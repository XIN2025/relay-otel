[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-otel"
version = "0.2.0"
description = "Crash-safe OpenTelemetry projection for a durable workflow journal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "bandit==1.8.6",
  "mypy==2.3.1",
  "pip-audit==2.9.0",
  "ruff==0.16.4",
]

[tool.uv]
required-version = "==0.12.5"

[project.scripts]
relay-otel = "relay_otel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "I", "UP"]
"src/relay/types.py" = ["UP040"]
"verify/*.py" = ["E402", "I", "UP"]

[tool.mypy]
files = ["src"]
strict = true
